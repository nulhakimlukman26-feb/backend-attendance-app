name: Deploy to VPS

# Auto-deploys AFTER the GHCR image is built successfully on main.
# Manual runs: Actions tab → "Deploy to VPS" → Run workflow.
on:
  workflow_run:
    workflows: ["Docker — Build & Push to GHCR"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}:latest

jobs:
  deploy:
    name: SSH deploy (compose pull + migrate)
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Checkout (compose file source)
        uses: actions/checkout@v4
        with:
          # workflow_run events check out the default branch HEAD by default;
          # pin to the exact commit that produced the image when available.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Copy compose file to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          source: "docker-compose.prod.yml"
          target: ${{ secrets.VPS_APP_DIR }}
          overwrite: true

      - name: Pull, migrate & restart on VPS
        uses: appleboy/ssh-action@v1.0.3
        env:
          APP_DIR: ${{ secrets.VPS_APP_DIR }}
          IMAGE: ${{ env.IMAGE }}
          GHCR_USER: ${{ github.repository_owner }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          envs: APP_DIR,IMAGE,GHCR_USER,GHCR_TOKEN
          script: |
            set -e
            cd "$APP_DIR"
            echo "→ Deploying $IMAGE into $APP_DIR"

            if [ ! -f .env ]; then
              echo "❌ .env not found in $APP_DIR."
              echo "   Create it once on the VPS (see .env.example in the repo) and re-run."
              exit 1
            fi

            if [ -n "$GHCR_TOKEN" ]; then
              echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            fi

            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d

            echo "→ Running DB migrations…"
            docker compose -f docker-compose.prod.yml run --rm app sequelize-cli db:migrate

            docker image prune -f

            echo "→ Health check (12 × 5s)…"
            for i in $(seq 1 12); do
              if curl -fsS http://localhost:3000/health; then
                echo ""
                echo "✅ Deploy healthy"
                break
              fi
              if [ "$i" = "12" ]; then
                echo "❌ App did not become healthy in time"
                docker compose -f docker-compose.prod.yml logs --tail=100 app
                exit 1
              fi
              sleep 5
            done

            docker compose -f docker-compose.prod.yml ps
            docker compose -f docker-compose.prod.yml logs --tail=30 app
